<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLENO Fluid Pixels</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="effect" id="effect" data-image="./chrome-head.png">
    <header>
      <p>PLENO / FLUID PIXELS</p>
      <div class="tabs" role="group" aria-label="이미지 선택">
        <button class="tab is-selected" data-image="./chrome-head.png" aria-pressed="true">CHROME HEAD</button>
        <button class="tab" data-image="./chrome-face.png" aria-pressed="false">CHROME FACE</button>
      </div>
    </header>
    <section class="canvas-stage" aria-label="포인터 반응 이미지 입자 효과">
      <canvas></canvas>
      <p class="hint">MOVE ACROSS</p>
    </section>
    <button class="replay" type="button">REPLAY</button>
  </main>
  <script type="module">
    import { PlenoFluidPixels } from './pleno-fluid-pixels.js';
    const root=document.querySelector('#effect'),effect=new PlenoFluidPixels(root);
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(tab=>{const on=tab===button;tab.classList.toggle('is-selected',on);tab.setAttribute('aria-pressed',on)});
      root.dataset.image=button.dataset.image;effect.setImage(button.dataset.image);
    }));
    document.querySelector('.replay').addEventListener('click',()=>effect.replay());
    window.effect=effect;
  </script>
</body>
</html>
